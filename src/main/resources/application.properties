spring.application.name=studybuddy

# Keep the session id in a cookie only, never in URLs (no ";jsessionid=..." on redirects).
server.servlet.session.tracking-modes=cookie

# Timetable upload (My profile > Edit availability). Files over the limit are refused.
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=1MB
# Parse uploads when the controller reads them, so an oversized file reaches ProfileController
# (which shows an error banner) instead of failing before any controller runs.
spring.servlet.multipart.resolve-lazily=true
