spring.application.name=studybuddy

# Local secrets (Discord bot token etc.) come from a git-ignored .env file in the project root,
# or from environment variables of the same name. See .env.example. Missing file is fine.
spring.config.import=optional:file:.env[.properties]

# Keep the session id in a cookie only, never in URLs (no ";jsessionid=..." on redirects).
server.servlet.session.tracking-modes=cookie

# Timetable upload (My profile > Edit availability). Files over the limit are refused.
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=1MB
# Parse uploads when the controller reads them, so an oversized file reaches ProfileController
# (which shows an error banner) instead of failing before any controller runs.
spring.servlet.multipart.resolve-lazily=true

# Business limits. Services read these once at startup; change them here, not in Java.
# Study groups (StudyGroupService)
studybuddy.group.max-name-length=60
studybuddy.group.max-description-length=300
studybuddy.group.min-size=2
studybuddy.group.max-size=10
# Student profile (ProfileEditService)
studybuddy.profile.min-year=1
studybuddy.profile.max-year=5
studybuddy.profile.max-looking-for-length=200
# Buddy requests (MatchRequestService)
studybuddy.request.max-message-length=300
# Ranges the admin may choose on the matching config page (MatchingConfigService)
studybuddy.matching.min-results=1
studybuddy.matching.max-results=50
studybuddy.matching.min-session-hours=1
studybuddy.matching.max-session-hours=4
# BOSS Advisor (BossAdvisorService): a student is stranded with fewer than enough-good-matches
# matches at or above good-match-score; people between near-miss-score and good are the near misses.
# good-match-score and enough-good-matches are only the starting values: the admin can change them.
studybuddy.advisor.good-match-score=0.60
studybuddy.advisor.near-miss-score=0.40
studybuddy.advisor.enough-good-matches=3
studybuddy.advisor.max-suggestions=3
# Ranges the admin may choose on the matching config page (BOSS Advisor card). The good-match
# score must stay above near-miss-score, so there is always an "almost matched" band to diagnose.
studybuddy.advisor.min-good-percent=45
studybuddy.advisor.max-good-percent=90
studybuddy.advisor.min-enough-good-matches=1
studybuddy.advisor.max-enough-good-matches=10
# Study sessions (SessionService): longest location text, and how many shared free times to suggest
studybuddy.session.max-location-length=80
studybuddy.session.max-suggestions=6
# Group activity feed (ActivityFeedService): how many recent rows a group page shows
studybuddy.activity.feed-size=10
