<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Accounts')}"></head>
<body>
<header th:replace="~{fragments/nav :: nav('admin')}"></header>
<div th:replace="~{fragments/toast :: toast}"></div>

<main>
  <div class="page-header">
    <div>
      <h1>Accounts</h1>
      <p class="text-secondary">Student and administrator accounts</p>
    </div>
    <a class="btn btn-primary" th:href="@{/admin/users/new}">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
        <circle cx="9" cy="7" r="4"/>
        <line x1="19" x2="19" y1="8" y2="14"/>
        <line x1="22" x2="16" y1="11" y2="11"/>
      </svg>New account</a>
  </div>

  <form class="card filter-bar" th:action="@{/admin/users}" method="get" role="search">
    <div class="filter-field">
      <label for="q">Search</label>
      <input id="q" name="q" type="search" th:value="${q}" placeholder="Name, email or ID">
    </div>
    <div class="filter-field">
      <label for="role">Role</label>
      <select id="role" name="role">
        <option value="">All roles</option>
        <option value="STUDENT" th:selected="${role == 'STUDENT'}">Students</option>
        <option value="ADMIN" th:selected="${role == 'ADMIN'}">Administrators</option>
      </select>
    </div>
    <div class="filter-field">
      <label for="status">Status</label>
      <select id="status" name="status">
        <option value="">Any status</option>
        <option value="ACTIVE" th:selected="${status == 'ACTIVE'}">Active</option>
        <option value="SUSPENDED" th:selected="${status == 'SUSPENDED'}">Suspended</option>
      </select>
    </div>
    <div class="filter-actions">
      <button type="submit" class="btn btn-secondary">Filter</button>
      <a class="btn btn-quiet" th:href="@{/admin/users}"
         th:if="${!#strings.isEmpty(q) or !#strings.isEmpty(role) or !#strings.isEmpty(status)}">Clear</a>
    </div>
  </form>

  <p class="results-summary" th:text="${users.size() == totalUsers ? totalUsers + ' accounts' : 'Showing ' + users.size() + ' of ' + totalUsers + ' accounts'}">51 accounts</p>

  <div class="card">
    <table class="table" th:if="${!#lists.isEmpty(users)}">
      <thead>
        <tr><th>Name</th><th>Role</th><th>Status</th><th></th></tr>
      </thead>
      <tbody>
        <tr th:each="u : ${users}">
          <td>
            <div class="person">
              <span class="avatar" th:text="${#strings.toUpperCase(#strings.substring(u.name, 0, 1))}">A</span>
              <div>
                <div class="person-name" th:text="${u.name}">Alex Tan</div>
                <div class="person-email" th:text="${u.email}">alex@smu.edu.sg</div>
              </div>
            </div>
          </td>
          <td th:text="${u.roleLabel}">Student</td>
          <td><span th:replace="~{fragments/badge :: badge(${u.status})}">ACTIVE</span></td>
          <td class="row-action"><a th:href="@{/admin/users/{id}(id=${u.id})}">View</a></td>
        </tr>
      </tbody>
    </table>
    <th:block th:if="${#lists.isEmpty(users)}">
      <div th:replace="~{fragments/empty-state :: empty-state-action('No accounts match these filters.', 'Clear filters', @{/admin/users})}"></div>
    </th:block>
  </div>
</main>
</body>
</html>
