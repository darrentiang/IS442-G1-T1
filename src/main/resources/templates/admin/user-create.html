<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('New account')}"></head>
<body>
<header th:replace="~{fragments/nav :: nav('admin')}"></header>
<div th:replace="~{fragments/toast :: toast}"></div>

<main>
  <div>
    <a class="back-link" th:href="@{/admin/users}">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="m12 19-7-7 7-7"/>
        <path d="M19 12H5"/>
      </svg>Back to accounts</a>
    <h1>New account</h1>
    <p class="text-secondary">Create a student or administrator account. New accounts start active.</p>
  </div>

  <div class="card card-narrow">
    <form th:action="@{/admin/users}" method="post">
      <label for="role">Account type</label>
      <select id="role" name="role">
        <option value="">Choose a type…</option>
        <option value="STUDENT" th:selected="${role == 'STUDENT'}">Student</option>
        <option value="ADMIN" th:selected="${role == 'ADMIN'}">Administrator</option>
      </select>
      <p th:replace="~{fragments/field-error :: field-error('role')}"></p>

      <div th:replace="~{fragments/account-fields :: account-fields}"></div>

      <button type="submit" class="btn btn-primary btn-block">Create account</button>
    </form>
  </div>
</main>
</body>
</html>
