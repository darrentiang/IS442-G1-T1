<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Edit account')}"></head>
<body>
<header th:replace="~{fragments/nav :: nav('admin')}"></header>
<div th:replace="~{fragments/toast :: toast}"></div>

<main>
  <div>
    <a class="back-link" th:href="@{/admin/users/{id}(id=${user.id})}">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="m12 19-7-7 7-7"/>
        <path d="M19 12H5"/>
      </svg>Back to account</a>
    <h1>Edit account</h1>
    <p class="text-secondary">Update the name or email of this account.</p>
  </div>

  <div class="card card-narrow">
    <form th:action="@{/admin/users/{id}(id=${user.id})}" method="post">
      <div th:replace="~{fragments/account-fields :: account-fields}"></div>
      <button type="submit" class="btn btn-primary btn-block">Save changes</button>
    </form>
  </div>
</main>
</body>
</html>
