<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<!--
  The signed-in student's active connections, with each buddy's contact number.
  Expects: connections (list of BuddyConnection).
-->
<head th:replace="~{fragments/head :: head('My buddies')}"></head>
<body>
<header th:replace="~{fragments/nav :: nav('connections')}"></header>
<div th:replace="~{fragments/toast :: toast}"></div>

<main>
  <div>
    <h1>My buddies</h1>
    <p class="text-secondary">Students you are connected with. Their contact numbers are shared with you.</p>
  </div>

  <div class="card">
    <table class="table" th:unless="${#lists.isEmpty(connections)}">
      <thead><tr><th>Buddy</th><th>Programme</th><th>Contact</th><th>Connected since</th><th></th></tr></thead>
      <tbody>
        <tr th:each="row : ${connections}">
          <td><a th:href="@{/buddies/{id}(id=${row.buddy.id},from='connections')}" th:text="${row.buddy.name}">Tan Wei Jie</a></td>
          <td th:text="${row.view.programme + ' · Year ' + row.view.yearOfStudy}">Information Systems · Year 3</td>
          <td th:text="${row.view.contactNumber}">91234567</td>
          <td th:text="${#temporals.format(row.since, 'd MMM yyyy')}">8 Nov 2026</td>
          <td>
            <div class="group-actions">
              <a class="btn btn-secondary" th:href="@{/sessions/new(buddy=${row.connectionId})}">Plan a session</a>
              <form th:action="@{/connections/{id}/end(id=${row.connectionId})}" method="post">
                <button type="submit" class="btn btn-quiet-danger">End connection</button>
              </form>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
    <th:block th:if="${#lists.isEmpty(connections)}">
      <div th:replace="~{fragments/empty-state :: empty-state-action('No buddies yet. Accept a buddy request, or send one to someone who matches you.', 'Find buddies', @{/buddies})}"></div>
    </th:block>
  </div>
</main>
</body>
</html>
