<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<!--
  Buddy requests the signed-in student has received and not yet answered.
  Expects: requests (list of PENDING MatchRequest sent to this student).
-->
<head th:replace="~{fragments/head :: head('Buddy requests')}"></head>
<body>
<header th:replace="~{fragments/nav :: nav('requests')}"></header>
<div th:replace="~{fragments/toast :: toast}"></div>

<main>
  <div class="page-header">
    <div>
      <h1>Buddy requests</h1>
      <p class="text-secondary">Accepting connects you and shares your contact numbers. Open a name to see their profile first.</p>
    </div>
  </div>

  <div class="card">
    <table class="table" th:unless="${#lists.isEmpty(requests)}">
      <thead><tr><th>From</th><th>Message</th><th></th></tr></thead>
      <tbody>
        <tr th:each="request : ${requests}">
          <td th:with="fp=${request.from.profile}">
            <div class="person">
              <span class="avatar" th:text="${#strings.toUpperCase(#strings.substring(request.from.name, 0, 1))}">T</span>
              <div>
                <a class="person-name" th:href="@{/buddies/{id}(id=${request.from.id},from='requests')}" th:text="${request.from.name}">Tan Wei Jie</a>
                <div class="person-email" th:if="${fp != null}"
                     th:text="${fp.programme + ' · Year ' + fp.yearOfStudy}">Information Systems · Year 3</div>
              </div>
            </div>
          </td>
          <td th:text="${#strings.isEmpty(request.message) ? 'No message' : request.message}" th:classappend="${#strings.isEmpty(request.message)} ? 'text-secondary'">Keen to work through the IS442 labs together?</td>
          <td>
            <form th:action="@{/requests/{id}/accept(id=${request.id})}" method="post">
              <button type="submit" class="btn btn-secondary">Accept</button>
              <button type="submit" class="btn btn-quiet-danger"
                      th:formaction="@{/requests/{id}/decline(id=${request.id})}">Decline</button>
            </form>
          </td>
        </tr>
      </tbody>
    </table>
    <th:block th:if="${#lists.isEmpty(requests)}">
      <div th:replace="~{fragments/empty-state :: empty-state-action('No buddy requests waiting. Requests other students send you will appear here.', 'Find buddies', @{/buddies})}"></div>
    </th:block>
  </div>
</main>
</body>
</html>
