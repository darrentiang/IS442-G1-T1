<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<!--
  Buddy requests the signed-in student has received and not yet answered.
  Expects: requests (list of PENDING MatchRequest sent to this student).
-->
<head th:replace="~{fragments/head :: head('Buddy requests')}"></head>
<body>
<header th:replace="~{fragments/nav :: nav('requests')}"></header>
<div th:replace="~{fragments/toast :: toast}"></div>

<main>
  <div>
    <h1>Buddy requests</h1>
    <p class="text-secondary">Accept to connect and share contact numbers, or decline.</p>
  </div>

  <div class="card">
    <table class="table" th:unless="${#lists.isEmpty(requests)}">
      <thead><tr><th>From</th><th>Message</th><th></th></tr></thead>
      <tbody>
        <tr th:each="request : ${requests}">
          <td><a th:href="@{/buddies/{id}(id=${request.from.id},from='requests')}" th:text="${request.from.name}">Tan Wei Jie</a></td>
          <td th:text="${request.message != null ? request.message : 'No message'}">Keen to work through the IS442 labs together?</td>
          <td>
            <form th:action="@{/requests/{id}/accept(id=${request.id})}" method="post">
              <button type="submit" class="btn btn-secondary">Accept</button>
              <button type="submit" class="btn btn-danger"
                      th:formaction="@{/requests/{id}/decline(id=${request.id})}">Decline</button>
            </form>
          </td>
        </tr>
      </tbody>
    </table>
    <th:block th:if="${#lists.isEmpty(requests)}">
      <div th:replace="~{fragments/empty-state :: empty-state('No pending buddy requests. Requests other students send you will appear here.')}"></div>
    </th:block>
  </div>
</main>
</body>
</html>
