<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  Icons: line drawings from Lucide (https://lucide.dev, ISC licence), copied in as inline SVG
  so there is no icon library, CDN or download. They take the text colour (currentColor) and
  are hidden from screen readers, so always put a text label next to one.
  Usage:  <svg th:replace="~{fragments/icon :: icon('users')}"></svg>
  To add an icon, copy its SVG children from lucide.dev into a new th:case below.
-->
<svg th:fragment="icon(name)" class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
     stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"
     th:switch="${name}">
  <th:block th:case="'users'">
    <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>
    <path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
  </th:block>
  <th:block th:case="'user'">
    <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
  </th:block>
  <th:block th:case="'user-plus'">
    <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>
    <line x1="19" x2="19" y1="8" y2="14"/><line x1="22" x2="16" y1="11" y2="11"/>
  </th:block>
  <th:block th:case="'user-x'">
    <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>
    <line x1="17" x2="22" y1="8" y2="13"/><line x1="22" x2="17" y1="8" y2="13"/>
  </th:block>
  <th:block th:case="'link'">
    <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
    <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
  </th:block>
  <th:block th:case="'book-open'">
    <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
  </th:block>
  <th:block th:case="'lock'">
    <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
  </th:block>
  <th:block th:case="'circle-check'">
    <circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>
  </th:block>
  <th:block th:case="'inbox'">
    <polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/>
    <path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>
  </th:block>
  <th:block th:case="'message'">
    <path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/>
  </th:block>
  <th:block th:case="'sliders'">
    <path d="M20 7h-9"/><path d="M14 17H5"/><circle cx="17" cy="17" r="3"/><circle cx="7" cy="7" r="3"/>
  </th:block>
  <th:block th:case="'search'">
    <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
  </th:block>
  <th:block th:case="'clock'">
    <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
  </th:block>
  <th:block th:case="'arrow-right'">
    <path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>
  </th:block>
</svg>
</body>
</html>
