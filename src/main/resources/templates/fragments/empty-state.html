<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  Empty state: shown instead of a blank table or list.
  Usage, wrapped in a th:block that decides when it shows:
    <th:block th:if="${#lists.isEmpty(requests)}">
      <div th:replace="~{fragments/empty-state :: empty-state('No pending requests')}"></div>
    </th:block>
-->
<div th:fragment="empty-state(message)" class="empty-state">
  <p th:text="${message}">No pending requests</p>
</div>

<!--
  The same, with a button for the next step, so an empty list is never a dead end.
  Usage: <div th:replace="~{fragments/empty-state :: empty-state-action('No buddies yet.', 'Find buddies', @{/buddies})}"></div>
-->
<div th:fragment="empty-state-action(message, label, url)" class="empty-state">
  <p th:text="${message}">No buddies yet.</p>
  <a class="btn btn-secondary" th:href="${url}" th:text="${label}">Find buddies</a>
</div>
</body>
</html>
