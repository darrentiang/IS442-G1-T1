<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Choose user')}"></head>
<body>
<header th:replace="~{fragments/nav :: nav('picker')}"></header>
<div th:replace="~{fragments/toast :: toast}"></div>

<main>
  <div class="card card-narrow">
    <h1>Study Buddy Matcher</h1>
    <p class="text-secondary">Choose who you are for this session</p>
    <p th:if="${next != null}" class="banner banner-info" role="status">Choose a user to open the group invite link.</p>

    <form th:action="@{/sign-in}" method="post">
      <input th:if="${next != null}" type="hidden" name="next" th:value="${next}">
      <label for="userSearch">Search users</label>
      <input id="userSearch" type="search" placeholder="Name, ID, or course" autocomplete="off"
             aria-controls="userSearchResults">
      <ul id="userSearchResults" class="user-search-results" aria-live="polite" hidden></ul>
      <p id="userSearchStatus" class="text-secondary" role="status" aria-live="polite" hidden>
        No users found. Try a name, ID, or course.
      </p>
      <label for="userId">User</label>
      <select id="userId" name="userId">
        <option value="">Choose a user…</option>
        <optgroup label="Administrator" data-user-group>
          <option th:each="a : ${admins}"
                  data-user-option
                  th:value="${a.id}"
                  th:text="${a.id + ' · ' + a.name}">A001 · Study Buddy Admin</option>
        </optgroup>
        <optgroup label="Students" data-user-group>
          <option th:each="s : ${students}"
                  data-user-option
                  th:value="${s.id}"
                  th:text="${s.id + ' · ' + s.name
                            + (s.profile.preferences.targetCourse == null ? '' : ' · ' + s.profile.preferences.targetCourse.code
                                + ' · Year ' + s.profile.yearOfStudy)
                            + (s.status.name() == 'SUSPENDED' ? ' · Suspended' : '')}">S001 · Tan Wei Jie · IS442 · Year 3</option>
        </optgroup>
      </select>
      <button type="submit" class="btn btn-primary btn-block">Continue</button>
    </form>
  </div>
</main>
<script th:src="@{/js/user-picker.js}"></script>
</body>
</html>
